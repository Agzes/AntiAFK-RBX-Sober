name: 🐞 Bug Report
description: Report a bug in AntiAFK-RBX-Sober
title: "[Bug]: "
labels: ["bug"]
assignees:
    - agzes
body:
    - type: markdown
      attributes:
          value: "## Thank you for reporting a bug! Please fill out this short form."
    - type: input
      id: version
      attributes:
          label: Version
          placeholder: e.g. v1.0.1
      validations:
          required: true
    - type: dropdown
      id: package
      attributes:
          label: Installation Method
          options:
              - AppImage
              - AUR (antiafk-rbx-sober)
              - .deb package
              - .rpm package
              - Built from source
              - Other
      validations:
          required: true
    - type: dropdown
      id: os
      attributes:
          label: Distribution
          options:
              - Arch / Arch-based (CachyOS, EndeavourOS, etc.)
              - Fedora / RPM-based (Workstation, Bazzite, Nobara, etc.)
              - Ubuntu / Debian / Mint / Pop!_OS
              - openSUSE
              - NixOS
              - Other Linux Distribution
      validations:
          required: true
    - type: input
      id: linux-de-wm
      attributes:
          label: DE / WM
          placeholder: e.g. Hyprland 0.55 (Wayland), KDE Plasma 6.6 (Wayland), GNOME 51 (Wayland)
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: Steps to Reproduce
          placeholder: |
              1. Click ...
              2. Press ...
              3. Bug happens
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior (optional)
          placeholder: What should have happened?
    - type: textarea
      id: actual
      attributes:
          label: Actual Behavior (optional)
          placeholder: What actually happened?
    - type: textarea
      id: context
      attributes:
          label: Extra Context / Screenshots (optional)
          placeholder: Any logs, Diagnostics output, images, or details.
